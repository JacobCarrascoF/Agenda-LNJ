<style>
  :root{
    --bg:#0a0a0a;
    --panel:#131313;
    --ink:#f5f5f5;
    --ink-soft:#8a8a8a;
    --ink-faint:#5a5a5a;
    --line:#242424;
    --line-soft:#1a1a1a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ background:var(--bg); }
  body{
    margin:0;
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 0 100px;
  }

  /* ---------- Header ---------- */
  .header{
    padding:26px 20px 22px;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .logo-mark{
    position:absolute;
    top:-30px; right:-30px;
    width:150px; height:150px;
    opacity:0.04;
    pointer-events:none;
  }
  .logo-badge{
    flex-shrink:0;
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid var(--line);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  .logo-badge img{
    width:100%;
    height:100%;
    display:block;
  }
  .header-text{ min-width:0; }
  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
    margin:0 0 4px;
  }
  .band-name{
    font-size:26px;
    font-weight:800;
    letter-spacing:-.02em;
    margin:0;
    line-height:1.05;
  }

  /* ---------- Próximo concierto (hero) ---------- */
  .next-up{
    padding:22px 20px 26px;
    border-bottom:1px solid var(--line);
  }
  .next-up-label{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:700;
    margin:0 0 12px;
  }
  .next-up-empty{
    color:var(--ink-soft);
    font-size:14px;
    padding:10px 0;
  }
  .next-card{
    display:flex;
    align-items:center;
    gap:18px;
  }
  .next-date{
    flex-shrink:0;
    text-align:center;
    min-width:64px;
  }
  .next-date .d{
    font-size:40px;
    font-weight:800;
    letter-spacing:-.03em;
    line-height:.95;
  }
  .next-date .m{
    font-size:11px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .next-info{ flex:1; min-width:0; }
  .next-info .city{
    font-size:22px;
    font-weight:800;
    letter-spacing:-.01em;
    margin:0 0 3px;
  }
  .next-info .venue{
    font-size:14px;
    color:var(--ink-soft);
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .next-info .countdown{
    display:inline-block;
    margin-top:10px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--bg);
    padding:5px 10px;
    border-radius:20px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    gap:8px;
    padding:16px 20px;
  }
  .btn{
    flex:1;
    font-family:inherit;
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    padding:12px 14px;
    cursor:pointer;
    border-radius:8px;
    -webkit-appearance:none;
  }
  .btn.primary{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
  .btn.small{ flex:none; padding:9px 14px; font-size:12px; }

  /* ---------- Lista de conciertos ---------- */
  .section-label{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-weight:700;
    padding:20px 20px 10px;
  }
  #list{
    list-style:none;
    margin:0;
    padding:0 20px;
  }
  .gig{
    border-bottom:1px solid var(--line-soft);
  }
  .gig-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 0;
    cursor:pointer;
  }
  .gig-date{
    flex-shrink:0;
    text-align:center;
    min-width:44px;
  }
  .gig-date .d{
    font-size:22px;
    font-weight:800;
    line-height:1;
  }
  .gig-date .m{
    font-size:9px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .gig-main{ flex:1; min-width:0; }
  .gig-city{
    font-size:16px;
    font-weight:700;
    margin:0 0 2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .gig-venue{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .gig-chevron{
    flex-shrink:0;
    color:var(--ink-faint);
    font-size:18px;
    transition:transform .2s;
  }
  .gig.open .gig-chevron{ transform:rotate(90deg); }

  .gig-detail{
    display:none;
    padding:2px 0 20px 60px;
  }
  .gig.open .gig-detail{ display:block; }
  .detail-row{
    display:flex;
    gap:10px;
    padding:8px 0;
    border-top:1px solid var(--line-soft);
    font-size:13.5px;
  }
  .detail-row:first-child{ border-top:none; }
  .detail-label{
    flex-shrink:0;
    width:78px;
    color:var(--ink-faint);
    font-weight:600;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding-top:1px;
  }
  .detail-value{
    flex:1;
    color:var(--ink);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .detail-value a{ color:var(--ink); text-decoration:underline; }
  .detail-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
  }

  .empty-hint{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:40px 20px;
    border:1px dashed var(--line);
    border-radius:10px;
    margin:0 20px;
  }

  /* ---------- Formulario / modal ---------- */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:50;
    align-items:flex-end;
  }
  .overlay.open{ display:flex; }
  .sheet{
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    padding:22px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .sheet-title{
    font-size:19px;
    font-weight:800;
    margin:0 0 18px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

    width:100%;
    font-family:inherit;
    font-size:15px;
    padding:12px 13px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#000;
    color:var(--ink);
    -webkit-appearance:none;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
  }

  .fab{
    position:fixed;
    bottom:24px;
    right:20px;
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--ink);
    color:var(--bg);
    border:none;
    font-size:26px;
    font-weight:400;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.5);
    z-index:20;
  }

  .delete-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:12px;
    font-weight:700;
    padding:11px 14px;
    border-radius:8px;
    cursor:pointer;
  }
</style>
</head>

<div class="wrap">

  <div class="header">
    <img class="logo-mark" src="icon-512.png" alt="">
    <div class="logo-badge"><img src="icon-192.png" alt="Los Niños Jesús"></div>
    <div class="header-text">
      <p class="eyebrow">Los Niños Jesús</p>
      <h1 class="band-name">Agenda de bolos</h1>
    </div>
  </div>

  <div class="next-up">
    <p class="next-up-label">Próximo concierto</p>
    <div id="nextUpBox"></div>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="addGigBtn">+ Añadir concierto</button>
  </div>

  <p class="section-label">Todos los conciertos</p>
  <ul id="list"></ul>
  <div id="emptyHint" class="empty-hint" style="display:none;">Todavía no hay conciertos.<br>Toca "Añadir concierto" para crear el primero.</div>

</div>

<button class="fab" id="fabAdd" aria-label="Añadir concierto">+</button>

<!-- Formulario -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 class="sheet-title" id="sheetTitle">Nuevo concierto</h2>
    <input type="hidden" id="gigId">

    <div class="field-row">
      <div class="field">
        <label for="gigDate">Fecha</label>
        <input type="date" id="gigDate">
      </div>
      <div class="field">
        <label for="gigTime">Hora del show</label>
        <input type="time" id="gigTime">
      </div>
    </div>

    <div class="field">
      <label for="gigCity">Ciudad</label>
      <input type="text" id="gigCity" placeholder="Ej. Pontevedra">
    </div>

    <div class="field">
      <label for="gigVenue">Sala / recinto</label>
      <input type="text" id="gigVenue" placeholder="Ej. Praza da Ferrería">
    </div>

    <div class="field">
      <label for="gigAddress">Dirección</label>
      <input type="text" id="gigAddress" placeholder="Para abrir en el mapa">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="gigSoundcheck">Prueba de sonido</label>
        <input type="time" id="gigSoundcheck">
      </div>
      <div class="field">
        <label for="gigCall">Hora de quedada</label>
        <input type="time" id="gigCall">
      </div>
    </div>

    <div class="field">
      <label for="gigContact">Contacto (promotor / técnico)</label>
      <input type="text" id="gigContact" placeholder="Nombre y teléfono">
    </div>

    <div class="field">
      <label for="gigNotes">Notas / hoja de ruta</label>
      <textarea id="gigNotes" placeholder="Hotel, catering, aparcamiento, lo que envíe el manager..."></textarea>
    </div>

    <div class="sheet-actions">
      <button class="btn" id="cancelBtn">Cancelar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

var STORAGE_KEY = 'lnj_gigs_v1';
var gigs = [];
var openGigId = null;

function loadGigs(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      gigs = JSON.parse(raw);
    } else {
      // Primera vez que se abre la app en este dispositivo: precargamos
      // los conciertos ya confirmados en el calendario de la banda.
      gigs = SEED_GIGS.slice();
      saveGigs();
    }
  }catch(e){ gigs = []; }
}
function saveGigs(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(gigs)); }catch(e){}
}

var MONTHS = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
var MONTHS_FULL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function parseDate(str){
  // str = 'YYYY-MM-DD'
  var parts = str.split('-');
  return new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
}

function todayStr(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}

function escapeHtml(str){
  var div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function upcomingGigs(){
  var today = todayStr();
  return gigs.filter(function(g){ return g.date >= today; })
             .sort(function(a,b){ return a.date < b.date ? -1 : 1; });
}
function pastGigs(){
  var today = todayStr();
  return gigs.filter(function(g){ return g.date < today; })
             .sort(function(a,b){ return a.date < b.date ? 1 : -1; });
}

function daysUntil(dateStr){
  var today = new Date();
  today.setHours(0,0,0,0);
  var target = parseDate(dateStr);
  target.setHours(0,0,0,0);
  var diff = Math.round((target - today) / 86400000);
  return diff;
}

function renderNextUp(){
  var box = document.getElementById('nextUpBox');
  var upcoming = upcomingGigs();
  if(upcoming.length === 0){
    box.innerHTML = '<div class="next-up-empty">No hay conciertos programados.</div>';
    return;
  }
  var g = upcoming[0];
  var d = parseDate(g.date);
  var days = daysUntil(g.date);
  var countdownText;
  if(days === 0) countdownText = 'Hoy';
  else if(days === 1) countdownText = 'Mañana';
  else countdownText = 'En ' + days + ' días';

  box.innerHTML =
    '<div class="next-card">' +
      '<div class="next-date"><div class="d">' + d.getDate() + '</div><div class="m">' + MONTHS[d.getMonth()] + '</div></div>' +
      '<div class="next-info">' +
        '<p class="city">' + escapeHtml(g.city || 'Sin ciudad') + '</p>' +
        '<p class="venue">' + escapeHtml(g.venue || '') + (g.time ? ' · ' + g.time : '') + '</p>' +
        '<span class="countdown">' + countdownText + '</span>' +
      '</div>' +
    '</div>';
}

function gigDetailHtml(g){
  var rows = '';
  function row(label, value, isLink){
    if(!value) return '';
    var inner = escapeHtml(value);
    if(isLink){
      var q = encodeURIComponent(value);
      inner = '<a href="https://maps.google.com/?q=' + q + '" target="_blank" rel="noopener">' + escapeHtml(value) + '</a>';
    }
    return '<div class="detail-row"><div class="detail-label">' + label + '</div><div class="detail-value">' + inner + '</div></div>';
  }
  rows += row('Dirección', g.address, true);
  rows += row('Quedada', g.callTime);
  rows += row('Prueba sonido', g.soundcheck);
  rows += row('Show', g.time);
  rows += row('Contacto', g.contact);
  rows += row('Notas', g.notes);

  return rows +
    '<div class="detail-actions">' +
      '<button class="btn small" onclick="editGig(\'' + g.id + '\')">Editar</button>' +
      '<button class="delete-btn" onclick="deleteGig(\'' + g.id + '\')">Eliminar</button>' +
    '</div>';
}

function renderList(){
  var list = document.getElementById('list');
  var emptyHint = document.getElementById('emptyHint');
  list.innerHTML = '';

  var ordered = upcomingGigs().concat(pastGigs());

  if(ordered.length === 0){
    emptyHint.style.display = 'block';
  } else {
    emptyHint.style.display = 'none';
  }

  ordered.forEach(function(g){
    var d = parseDate(g.date);
    var li = document.createElement('li');
    li.className = 'gig' + (openGigId === g.id ? ' open' : '');

    var isPast = g.date < todayStr();
    li.style.opacity = isPast ? '0.45' : '1';

    li.innerHTML =
      '<div class="gig-row" onclick="toggleGig(\'' + g.id + '\')">' +
        '<div class="gig-date"><div class="d">' + d.getDate() + '</div><div class="m">' + MONTHS[d.getMonth()] + '</div></div>' +
        '<div class="gig-main">' +
          '<p class="gig-city">' + escapeHtml(g.city || 'Sin ciudad') + '</p>' +
          '<p class="gig-venue">' + escapeHtml(g.venue || 'Sala sin especificar') + '</p>' +
        '</div>' +
        '<div class="gig-chevron">›</div>' +
      '</div>' +
      '<div class="gig-detail">' + gigDetailHtml(g) + '</div>';

    list.appendChild(li);
  });
}

function toggleGig(id){
  openGigId = (openGigId === id) ? null : id;
  renderList();
}

function render(){
  renderNextUp();
  renderList();
}

// ---------- Formulario ----------
var overlay = document.getElementById('overlay');
var sheetTitle = document.getElementById('sheetTitle');

function openForm(gig){
  document.getElementById('gigId').value = gig ? gig.id : '';
  document.getElementById('gigDate').value = gig ? gig.date : '';
  document.getElementById('gigTime').value = gig ? (gig.time || '') : '';
  document.getElementById('gigCity').value = gig ? (gig.city || '') : '';
  document.getElementById('gigVenue').value = gig ? (gig.venue || '') : '';
  document.getElementById('gigAddress').value = gig ? (gig.address || '') : '';
  document.getElementById('gigSoundcheck').value = gig ? (gig.soundcheck || '') : '';
  document.getElementById('gigCall').value = gig ? (gig.callTime || '') : '';
  document.getElementById('gigContact').value = gig ? (gig.contact || '') : '';
  document.getElementById('gigNotes').value = gig ? (gig.notes || '') : '';
  sheetTitle.textContent = gig ? 'Editar concierto' : 'Nuevo concierto';
  overlay.classList.add('open');
}
function closeForm(){
  overlay.classList.remove('open');
}

document.getElementById('addGigBtn').onclick = function(){ openForm(null); };
document.getElementById('fabAdd').onclick = function(){ openForm(null); };
document.getElementById('cancelBtn').onclick = closeForm;
overlay.addEventListener('click', function(e){ if(e.target === overlay) closeForm(); });

document.getElementById('saveBtn').onclick = function(){
  var date = document.getElementById('gigDate').value;
  var city = document.getElementById('gigCity').value.trim();
  if(!date || !city){
    alert('Al menos pon la fecha y la ciudad.');
    return;
  }
  var id = document.getElementById('gigId').value;
  var gig = {
    id: id || ('gig_' + Date.now()),
    date: date,
    time: document.getElementById('gigTime').value,
    city: city,
    venue: document.getElementById('gigVenue').value.trim(),
    address: document.getElementById('gigAddress').value.trim(),
    soundcheck: document.getElementById('gigSoundcheck').value,
    callTime: document.getElementById('gigCall').value,
    contact: document.getElementById('gigContact').value.trim(),
    notes: document.getElementById('gigNotes').value.trim()
  };

  if(id){
    var idx = gigs.findIndex(function(g){ return g.id === id; });
    if(idx !== -1) gigs[idx] = gig;
  } else {
    gigs.push(gig);
    openGigId = gig.id;
  }

  saveGigs();
  closeForm();
  render();
};

function editGig(id){
  var g = gigs.find(function(x){ return x.id === id; });
  if(g) openForm(g);
}
function deleteGig(id){
  if(!confirm('¿Eliminar este concierto?')) return;
  gigs = gigs.filter(function(g){ return g.id !== id; });
  if(openGigId === id) openGigId = null;
  saveGigs();
  render();
}

loadGigs();
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  });
}
</script>
